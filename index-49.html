<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Pendeteksi Gerakan & Objek</title>
<style>
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{
    margin:0;padding:0;width:100%;height:100%;
    background:#000;color:#fff;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    overflow:hidden;
  }

  #stage{
    position:fixed;inset:0;
    display:flex;align-items:center;justify-content:center;
    background:#000;
  }
  video{display:none;}
  #overlay{
    max-width:100%;max-height:100%;
    width:auto;height:auto;
  }

  /* Top bar */
  #topbar{
    position:fixed;top:0;left:0;right:0;
    padding:calc(env(safe-area-inset-top,0px) + 14px) 16px 40px 16px;
    background:linear-gradient(to bottom, rgba(0,0,0,0.75), rgba(0,0,0,0));
    display:flex;align-items:center;justify-content:space-between;
    z-index:5;pointer-events:none;
  }
  #topbar *{pointer-events:auto;}
  #titleBlock{display:flex;flex-direction:column;gap:2px;}
  #title{font-size:16px;font-weight:600;letter-spacing:0.2px;}
  #subtitle{font-size:12px;color:rgba(255,255,255,0.6);}

  #statusPill{
    display:inline-flex;align-items:center;gap:6px;
    padding:6px 12px;border-radius:20px;
    background:rgba(255,255,255,0.12);
    backdrop-filter:blur(6px);
    font-size:13px;font-weight:500;
    transition:background 0.2s,color 0.2s;
  }
  #statusPill .dot{
    width:8px;height:8px;border-radius:50%;
    background:#4ade80;
    transition:background 0.2s;
  }
  #statusPill.motion{
    background:rgba(255,60,60,0.25);
    color:#ff6b6b;
  }
  #statusPill.motion .dot{
    background:#ff3b3b;
    box-shadow:0 0 8px #ff3b3b;
    animation:pulse 0.8s infinite;
  }
  @keyframes pulse{
    0%,100%{opacity:1;}
    50%{opacity:0.4;}
  }

  /* Loading toast */
  #loading{
    position:fixed;top:calc(env(safe-area-inset-top,0px) + 70px);left:50%;
    transform:translateX(-50%);
    background:rgba(20,20,20,0.85);
    backdrop-filter:blur(6px);
    padding:8px 16px;border-radius:12px;
    font-size:12px;color:rgba(255,255,255,0.75);
    z-index:5;transition:opacity 0.3s;
    max-width:85%;text-align:center;
  }
  #loading.hidden{opacity:0;pointer-events:none;}

  /* Bottom controls */
  #bottombar{
    position:fixed;bottom:0;left:0;right:0;
    padding:16px 16px calc(env(safe-area-inset-bottom,0px) + 18px) 16px;
    background:linear-gradient(to top, rgba(0,0,0,0.85), rgba(0,0,0,0));
    z-index:5;
  }

  #sensRow{
    display:flex;align-items:center;gap:10px;
    margin-bottom:16px;
    padding:0 4px;
  }
  #sensRow span{font-size:12px;color:rgba(255,255,255,0.7);white-space:nowrap;}
  input[type=range]{
    flex:1;
    -webkit-appearance:none;
    height:4px;border-radius:2px;
    background:rgba(255,255,255,0.25);
    outline:none;
  }
  input[type=range]::-webkit-slider-thumb{
    -webkit-appearance:none;
    width:20px;height:20px;border-radius:50%;
    background:#fff;
    box-shadow:0 1px 4px rgba(0,0,0,0.4);
  }

  #controlsRow{
    display:flex;align-items:center;justify-content:center;
    gap:18px;
  }

  .btn{
    border:none;border-radius:50%;
    background:rgba(255,255,255,0.12);
    color:#fff;
    display:flex;align-items:center;justify-content:center;
    cursor:pointer;
    transition:background 0.15s,transform 0.1s;
  }
  .btn:active{transform:scale(0.92);background:rgba(255,255,255,0.25);}

  .btn-side{
    width:52px;height:52px;
    font-size:20px;
  }

  #playBtn{
    width:72px;height:72px;
    background:#fff;
    color:#000;
    font-size:26px;
  }
  #playBtn:active{background:#ddd;}
  #playBtn.playing{
    background:rgba(255,60,60,0.9);
    color:#fff;
  }

  .btn-label{
    position:absolute;
    bottom:-18px;left:50%;transform:translateX(-50%);
    font-size:10px;color:rgba(255,255,255,0.6);
    white-space:nowrap;
  }
  .btn-wrap{position:relative;display:flex;flex-direction:column;align-items:center;}

  /* Permission / error screen */
  #permScreen{
    position:fixed;inset:0;z-index:10;
    background:#0a0a0a;
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    text-align:center;padding:30px;
  }
  #permScreen.hidden{display:none;}
  #permScreen .icon{font-size:48px;margin-bottom:16px;}
  #permScreen h2{font-size:18px;margin:0 0 8px 0;}
  #permScreen p{font-size:14px;color:rgba(255,255,255,0.6);margin:0 0 20px 0;max-width:280px;line-height:1.5;}
  #retryBtn{
    background:#fff;color:#000;border:none;padding:12px 28px;
    border-radius:24px;font-size:15px;font-weight:600;cursor:pointer;
  }
</style>
</head>
<body>

<div id="stage">
  <video id="video" autoplay playsinline muted></video>
  <canvas id="overlay"></canvas>
</div>

<div id="topbar">
  <div id="titleBlock">
    <div id="title">Pendeteksi Gerakan</div>
    <div id="subtitle">Kotak merah = gerakan · hijau = objek</div>
  </div>
  <div id="statusPill"><span class="dot"></span><span id="statusText">Siap</span></div>
</div>

<div id="loading">Memuat model deteksi objek...</div>

<div id="bottombar">
  <div id="sensRow">
    <span>Sensitivitas</span>
    <input type="range" id="sens" min="5" max="100" value="25">
  </div>
  <div id="controlsRow">
    <div class="btn-wrap">
      <button class="btn btn-side" id="switchBtn">🔄</button>
      <span class="btn-label">Kamera</span>
    </div>
    <div class="btn-wrap">
      <button class="btn" id="playBtn">⏸</button>
      <span class="btn-label">Jeda</span>
    </div>
    <div class="btn-wrap">
      <button class="btn btn-side" id="labelBtn">🏷️</button>
      <span class="btn-label" id="labelBtnText">Label</span>
    </div>
  </div>
</div>

<div id="permScreen">
  <div class="icon">📷</div>
  <h2>Izin Kamera Diperlukan</h2>
  <p>Aplikasi ini butuh akses kamera untuk mendeteksi gerakan dan objek secara langsung.</p>
  <button id="retryBtn">Aktifkan Kamera</button>
</div>

<!-- TensorFlow.js + model COCO-SSD untuk deteksi & pelabelan objek -->
<script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@4.20.0/dist/tf.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/coco-ssd@2.2.3/dist/coco-ssd.min.js"></script>

<script>
const video = document.getElementById('video');
const overlay = document.getElementById('overlay');
const ctx = overlay.getContext('2d');
const statusPill = document.getElementById('statusPill');
const statusText = document.getElementById('statusText');
const loadingEl = document.getElementById('loading');
const sensInput = document.getElementById('sens');
const switchBtn = document.getElementById('switchBtn');
const playBtn = document.getElementById('playBtn');
const labelBtn = document.getElementById('labelBtn');
const labelBtnText = document.getElementById('labelBtnText');
const permScreen = document.getElementById('permScreen');
const retryBtn = document.getElementById('retryBtn');

let processCanvas, pctx;
let prevFrame = null;
let running = false;
let paused = false;
let stream = null;
let rafId = null;
let objModel = null;
let currentFacing = 'environment';
let lastObjects = [];
let frameCounter = 0;
let showLabels = true;

async function loadModel(){
  try{
    objModel = await cocoSsd.load();
    loadingEl.textContent = 'Model siap ✓';
    setTimeout(()=> loadingEl.classList.add('hidden'), 1500);
  }catch(err){
    loadingEl.textContent = 'Model objek gagal dimuat (gerakan tetap jalan)';
    setTimeout(()=> loadingEl.classList.add('hidden'), 2500);
  }
}
loadModel();

async function startCamera(){
  try{
    if(stream){
      stream.getTracks().forEach(t=>t.stop());
    }
    const constraints = {
      video:{
        facingMode: { ideal: currentFacing },
        width: { ideal: 1280 },
        height: { ideal: 720 }
      },
      audio:false
    };
    stream = await navigator.mediaDevices.getUserMedia(constraints);
    video.srcObject = stream;
    await video.play();

    const w = video.videoWidth || 640;
    const h = video.videoHeight || 480;
    overlay.width = w;
    overlay.height = h;

    processCanvas = document.createElement('canvas');
    processCanvas.width = w/4;
    processCanvas.height = h/4;
    pctx = processCanvas.getContext('2d', {willReadFrequently:true});

    running = true;
    paused = false;
    prevFrame = null;
    permScreen.classList.add('hidden');
    setStatus(false, 'Mendeteksi');
    playBtn.textContent = '⏸';
    playBtn.classList.remove('playing');
    loop();
  }catch(err){
    permScreen.classList.remove('hidden');
  }
}

function togglePause(){
  paused = !paused;
  if(paused){
    playBtn.textContent = '▶';
    setStatus(false, 'Dijeda');
  }else{
    playBtn.textContent = '⏸';
    setStatus(false, 'Mendeteksi');
    loop();
  }
}

function switchCamera(){
  currentFacing = (currentFacing === 'user') ? 'environment' : 'user';
  if(running) startCamera();
}

function toggleLabels(){
  showLabels = !showLabels;
  labelBtn.style.opacity = showLabels ? '1' : '0.4';
  labelBtnText.textContent = showLabels ? 'Label' : 'Off';
}

function setStatus(motion, text){
  statusText.textContent = text;
  if(motion){
    statusPill.classList.add('motion');
  }else{
    statusPill.classList.remove('motion');
  }
}

let isDetecting = false;
async function detectObjects(){
  if(!objModel || !showLabels || isDetecting) return;
  isDetecting = true;
  try{
    const results = await objModel.detect(video);
    lastObjects = results.filter(o => o.score >= 0.5);
  }catch(err){}
  isDetecting = false;
}

function loop(){
  if(!running || paused) return;

  const pw = processCanvas.width, ph = processCanvas.height;
  pctx.drawImage(video, 0, 0, pw, ph);
  const frame = pctx.getImageData(0,0,pw,ph);

  ctx.drawImage(video, 0, 0, overlay.width, overlay.height);

  let motionDetected = false;

  if(prevFrame){
    const threshold = parseInt(sensInput.value);
    const scaleX = overlay.width / pw;
    const scaleY = overlay.height / ph;

    let minX=pw, minY=ph, maxX=0, maxY=0;
    let motionCount = 0;

    const blockSize = 4;
    for(let y=0; y<ph; y+=blockSize){
      for(let x=0; x<pw; x+=blockSize){
        let diffSum = 0;
        let samples = 0;
        for(let by=0; by<blockSize && y+by<ph; by++){
          for(let bx=0; bx<blockSize && x+bx<pw; bx++){
            const idx = ((y+by)*pw + (x+bx))*4;
            const dr = Math.abs(frame.data[idx] - prevFrame.data[idx]);
            const dg = Math.abs(frame.data[idx+1] - prevFrame.data[idx+1]);
            const db = Math.abs(frame.data[idx+2] - prevFrame.data[idx+2]);
            diffSum += (dr+dg+db)/3;
            samples++;
          }
        }
        const avgDiff = diffSum/samples;
        if(avgDiff > threshold){
          motionCount++;
          if(x < minX) minX = x;
          if(y < minY) minY = y;
          if(x+blockSize > maxX) maxX = x+blockSize;
          if(y+blockSize > maxY) maxY = y+blockSize;
        }
      }
    }

    if(motionCount > 3){
      motionDetected = true;
      const rx = minX*scaleX, ry = minY*scaleY;
      const rw = (maxX-minX)*scaleX, rh = (maxY-minY)*scaleY;
      ctx.strokeStyle = '#ff3b3b';
      ctx.lineWidth = 3;
      ctx.shadowColor = '#ff3b3b';
      ctx.shadowBlur = 8;
      ctx.strokeRect(rx, ry, rw, rh);
      ctx.shadowBlur = 0;

      // Cari objek yang paling tumpang tindih dengan area gerakan, lalu labeli kotak merahnya
      let matchLabel = 'Gerakan';
      let bestOverlap = 0;
      for(const obj of lastObjects){
        const [ox,oy,ow,oh] = obj.bbox;
        const ix = Math.max(rx, ox);
        const iy = Math.max(ry, oy);
        const iw = Math.min(rx+rw, ox+ow) - ix;
        const ih = Math.min(ry+rh, oy+oh) - iy;
        if(iw > 0 && ih > 0){
          const overlapArea = iw*ih;
          if(overlapArea > bestOverlap){
            bestOverlap = overlapArea;
            matchLabel = `${obj.class} ${Math.round(obj.score*100)}%`;
          }
        }
      }

      ctx.font = '600 15px -apple-system,sans-serif';
      const textWidth = ctx.measureText(matchLabel).width;
      const labelY = ry > 24 ? ry - 22 : ry + rh + 2;
      ctx.fillStyle = '#ff3b3b';
      ctx.fillRect(rx, labelY, textWidth+10, 22);
      ctx.fillStyle = '#fff';
      ctx.fillText(matchLabel, rx+5, labelY+16);
    }
  }

  // Kotak hijau terpisah dimatikan — nama objek sudah ditampilkan di kotak merah (area gerakan)
  // if(showLabels){
  //   for(const obj of lastObjects){ ... }
  // }

  setStatus(motionDetected, motionDetected ? 'Gerakan!' : 'Mendeteksi');

  prevFrame = frame;

  frameCounter++;
  if(frameCounter % 8 === 0){
    detectObjects();
  }

  rafId = requestAnimationFrame(loop);
}

playBtn.addEventListener('click', togglePause);
switchBtn.addEventListener('click', switchCamera);
labelBtn.addEventListener('click', toggleLabels);
retryBtn.addEventListener('click', startCamera);

startCamera();
</script>

</body>
</html>
